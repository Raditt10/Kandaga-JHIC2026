<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Lingkaran hitam background -->
  <circle cx="100" cy="100" r="100" fill="#1A1A1A"/>

  <!-- ── PELUIT ── -->
  <!-- Badan peluit: kotak rounded atas -->
  <rect x="44" y="58" width="90" height="46" rx="10" ry="10" fill="white"/>

  <!-- Garis horizontal pemisah di dalam peluit -->
  <rect x="44" y="82" width="90" height="6" fill="#1A1A1A"/>

  <!-- Diamond kecil di tengah bagian atas peluit -->
  <rect x="83" y="63" width="12" height="12" rx="1.5" fill="#1A1A1A" transform="rotate(45 89 69)"/>

  <!-- Ekor peluit: tab kiri bawah -->
  <rect x="44" y="88" width="34" height="24" rx="5" ry="5" fill="white"/>

  <!-- ── KACA PEMBESAR ── -->
  <!-- Lingkaran luar kaca pembesar -->
  <circle cx="134" cy="130" r="22" fill="white"/>
  <!-- Lubang kaca pembesar -->
  <circle cx="134" cy="130" r="13" fill="#1A1A1A"/>
  <!-- Gagang kaca pembesar -->
  <line x1="150" y1="146" x2="166" y2="162" stroke="white" stroke-width="10" stroke-linecap="round"/>
</svg>
